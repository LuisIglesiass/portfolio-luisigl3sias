<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/fav.ico" sizes="any" />
    <title>404 — Luis Iglesias</title>
    <style>
      :root {
        --bg: #f8f6f1;
        --fg: #1d1511;
        --muted: #6b5f56;
        --primary: #d0541f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0e11;
          --fg: #ece6db;
          --muted: #a89f95;
          --primary: #e06a35;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
        font-family: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
      }
      .eyebrow {
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        color: var(--muted);
        margin-bottom: 1rem;
      }
      h1 {
        font-family: Georgia, "Fraunces", serif;
        font-weight: 500;
        font-size: clamp(2.5rem, 8vw, 5rem);
        color: var(--primary);
        margin: 0 0 1.5rem;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        border-radius: 999px;
        background: var(--primary);
        color: var(--bg);
        font-family: inherit;
        font-size: 0.875rem;
        padding: 0.75rem 1.5rem;
        text-decoration: none;
      }
      a.btn:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <span class="eyebrow">404 — NOT FOUND</span>
    <h1>Lost page</h1>
    <a class="btn" href="/">Back to home</a>
  </body>
</html>
